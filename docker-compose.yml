# Pact Broker local — visibilidade de contratos para o time (UI em http://localhost:9292)
#
# Subir só o Broker (uso diário do time):
#   docker compose up -d
#
# Rodar testes no container e publicar contratos no Broker:
#   docker compose --profile test up --build --abort-on-container-exit
#
# Abrir no browser: http://localhost:9292

services:
  postgres:
    image: postgres:17-alpine
    container_name: pact-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pact-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pact-broker
    restart: unless-stopped
    ports:
      - "9292:9292"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_DATABASE_URL: postgres://postgres:password@postgres/postgres
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: "10"
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
      PACT_BROKER_BASIC_AUTH_USERNAME: pact
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact
      PACT_BROKER_BASE_URL: http://localhost:9292 http://pact-broker:9292 http://host.docker.internal:9292
      PACT_BROKER_LOG_LEVEL: INFO

  pact-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pact-consumer
    profiles:
      - test
    depends_on:
      pact-broker:
        condition: service_started
    volumes:
      - pact-artifacts:/app/tests/contract/pacts
    environment:
      NODE_ENV: test

  pact-publish:
    image: pactfoundation/pact-cli:latest
    container_name: pact-publish
    profiles:
      - test
    depends_on:
      pact-consumer:
        condition: service_completed_successfully
      pact-broker:
        condition: service_started
    volumes:
      - pact-artifacts:/pacts:ro
    environment:
      PACT_BROKER_BASE_URL: http://pact-broker:9292
      PACT_BROKER_USERNAME: pact
      PACT_BROKER_PASSWORD: pact
      PACT_CONSUMER_VERSION: ${PACT_CONSUMER_VERSION:-local}
      PACT_BRANCH: ${PACT_BRANCH:-main}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pact-broker publish /pacts \
          --broker-base-url="$$PACT_BROKER_BASE_URL" \
          --broker-username="$$PACT_BROKER_USERNAME" \
          --broker-password="$$PACT_BROKER_PASSWORD" \
          --consumer-app-version="$$PACT_CONSUMER_VERSION" \
          --branch="$$PACT_BRANCH"
        echo ""
        echo "Contratos visíveis em http://localhost:9292"

volumes:
  pact-postgres-data:
  pact-artifacts:
