sonar.organization=ab-inbev
sonar.projectKey=martech-oneway-reports-data-service
sonar.projectName=martech-oneway-reports-data-service
sonar.language=typescript

# Exclusions - only essential exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/test/**,**/__mocks__/**,**/main.ts

# Source and test directories
sonar.sources=src/
sonar.tests=src/
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.test.ts

# Coverage exclusions - only essential exclusions
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/test/**,**/__mocks__/**,**/main.ts

# Coverage and test reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=junit.xml
sonar.ts.tslintconfigpath=eslint.config.mjs
sonar.sourceEncoding=UTF-8

# Additional NestJS specific configurations
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.reportPaths=coverage/lcov.info