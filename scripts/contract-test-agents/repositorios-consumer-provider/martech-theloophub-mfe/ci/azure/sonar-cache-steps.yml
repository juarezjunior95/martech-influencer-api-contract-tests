steps:
  - script: mkdir -p "$(HOME)/.sonar/cache"
    displayName: Prepare SonarCloud scanner cache directory

  - task: Cache@2
    displayName: Cache SonarCloud scanner
    inputs:
      key: 'sonar | "$(Agent.OS)" | $(Build.Repository.LocalPath)/$(Build.Repository.Name)/sonar-project.properties'
      restoreKeys: |
        sonar | "$(Agent.OS)"
      path: '$(HOME)/.sonar/cache'
      cacheHitVar: SONAR_CACHE_RESTORED
