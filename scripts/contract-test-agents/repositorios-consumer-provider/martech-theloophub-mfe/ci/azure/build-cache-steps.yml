steps:
  - script: |
      mkdir -p "$(Build.Repository.LocalPath)/$(Build.Repository.Name)/.webpack-cache"
      mkdir -p "$(Build.Repository.LocalPath)/$(Build.Repository.Name)/.babel-cache"
    displayName: Prepare Webpack build cache directories

  - task: Cache@2
    displayName: Cache Webpack build
    inputs:
      key: 'webpack | "$(Agent.OS)" | "$(NodeVersion)" | $(Build.Repository.LocalPath)/$(Build.Repository.Name)/package.json, $(Build.Repository.LocalPath)/$(Build.Repository.Name)/webpack.config.js, $(Build.Repository.LocalPath)/$(Build.Repository.Name)/babel.config.json'
      restoreKeys: |
        webpack | "$(Agent.OS)" | "$(NodeVersion)"
        webpack | "$(Agent.OS)"
      path: '$(Build.Repository.LocalPath)/$(Build.Repository.Name)/.webpack-cache'
      cacheHitVar: WEBPACK_CACHE_RESTORED

  - task: Cache@2
    displayName: Cache Babel build
    inputs:
      key: 'babel | "$(Agent.OS)" | "$(NodeVersion)" | $(Build.Repository.LocalPath)/$(Build.Repository.Name)/package.json, $(Build.Repository.LocalPath)/$(Build.Repository.Name)/babel.config.json'
      restoreKeys: |
        babel | "$(Agent.OS)" | "$(NodeVersion)"
        babel | "$(Agent.OS)"
      path: '$(Build.Repository.LocalPath)/$(Build.Repository.Name)/.babel-cache'
      cacheHitVar: BABEL_CACHE_RESTORED
